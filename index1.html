<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>업무 관리 시스템</title>
  <!-- Tailwind CSS (반응형 디자인) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS (실시간 DB) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SheetJS (엑셀 업로드/다운로드) -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-16">

  <!-- 팀 입장 코드 잠금 오버레이 -->
  <div id="accessLockOverlay" class="fixed inset-0 z-50 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 border border-slate-200 space-y-4">
      <div class="text-center space-y-1">
        <div class="text-3xl">🔒</div>
        <h1 class="text-lg font-extrabold text-slate-900">업무 관리 시스템</h1>
        <p class="text-xs text-slate-500">지정된 팀원만 접근할 수 있습니다.<br/>전달받은 팀 입장 코드를 입력해주세요.</p>
      </div>

      <form onsubmit="verifyAccessCode(event)" class="space-y-3">
        <div>
          <input
            type="password"
            id="accessCodeInput"
            autocomplete="current-password"
            placeholder="팀 입장 코드 입력"
            class="w-full text-sm text-center tracking-widest border border-slate-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-blue-600"
            required
          />
          <p id="accessCodeError" class="hidden text-xs text-red-600 font-semibold text-center mt-1.5">
            입장 코드가 올바르지 않습니다. 다시 확인해주세요.
          </p>
        </div>
        <button
          type="submit"
          class="w-full bg-blue-700 hover:bg-blue-800 text-white text-sm font-bold py-2.5 rounded-xl shadow-sm transition cursor-pointer"
        >
          입장하기
        </button>
      </form>
    </div>
  </div>

  <!-- 메인 앱 래퍼 (인증 전까지 숨김) -->
  <div id="appWrapper" class="hidden">

    <!-- 상단 헤더 -->
    <header class="bg-blue-700 text-white shadow-md sticky top-0 z-20">
      <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="text-xl font-bold tracking-tight">🏥 업무 관리 시스템</span>
          <span id="realtimeBadge" class="text-xs bg-emerald-500 text-white px-2 py-0.5 rounded-full animate-pulse">● 실시간 연동중</span>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
          <button type="button" onclick="downloadTemplate()" class="text-xs bg-blue-600 hover:bg-blue-500 border border-blue-400 px-2.5 py-1.5 rounded cursor-pointer">
            양식 받기
          </button>
          <label class="text-xs bg-white text-blue-700 font-semibold hover:bg-blue-50 px-3 py-1.5 rounded cursor-pointer shadow-sm">
            📤 엑셀 업로드
            <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelUpload(event)" />
          </label>
          <button type="button" onclick="exportToExcel()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-3 py-1.5 rounded shadow-sm cursor-pointer">
            📥 결과 다운로드
          </button>
          <button type="button" onclick="lockApp()" class="text-xs bg-blue-900 hover:bg-blue-950 text-blue-100 border border-blue-500 px-2.5 py-1.5 rounded cursor-pointer">
            🔒 잠금
          </button>
        </div>
      </div>

      <!-- 엑셀 업로드 시 생성되는 진입 메뉴(아이템별) 바 -->
      <div class="bg-blue-800/95 border-t border-blue-600">
        <div class="max-w-6xl mx-auto px-4 py-2 flex items-center gap-2 overflow-x-auto" id="entryMenuBar">
          <span class="text-xs text-blue-200 font-semibold shrink-0">🚩 진입 메뉴:</span>
          <button type="button" onclick="setItemMenu('ALL')" class="px-3 py-1 rounded-md text-xs font-bold bg-white text-blue-800 shrink-0">
            전체 메뉴 (0)
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-6 space-y-6">

      <!-- 메뉴 데이터 관리 바 -->
      <section class="bg-white rounded-xl shadow-sm px-4 py-3 border border-slate-200 flex flex-wrap items-center justify-between gap-2">
        <div class="text-xs font-bold text-slate-700">
          📋 현재 범위: <span id="currentMenuLabel" class="text-blue-600">(전체 메뉴)</span>
        </div>
        <div class="flex items-center gap-3">
          <button type="button" onclick="deleteSelectedMenuData()" class="text-xs text-amber-600 hover:underline cursor-pointer">
            선택 메뉴 삭제
          </button>
          <button type="button" onclick="clearAllData()" class="
